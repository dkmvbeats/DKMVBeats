<!DOCTYPE html>
<html lang="fr">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Printemps Du Coeur – Prise de RDV</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <nav>
        <h1><a href="accueil.html">Le Printemps Du Coeur</a></h1>
        <ul>
            <li><a href="accueil.html">Accueil</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="rendez-vous.html">Prise de RDV</a></li>
        </ul>
    </nav>
</header>

<!-- FORMULAIRE -->
<section class="reservation">
    <h2>Formulaire de rendez-vous</h2>
    <form action="#" method="post" class="reservation-form">
        <label for="service">Choisissez un service :</label>
        <select id="service" name="service" required>
            <option value="">-- Sélectionnez un service --</option>
            <option value="coaching-personnel">Coaching Holistique</option>
            <option value="bien-etre">Séance Bien-Être</option>
            <option value="meditation">Suivi Personnalisé</option>
        </select>

        <label for="name">Votre nom :</label>
        <input type="text" id="name" name="name" placeholder="Votre nom" required>

        <label for="email">Votre email :</label>
        <input type="email" id="email" name="email" placeholder="Votre email" required>

        <label for="date">Date souhaitée :</label>
        <input type="date" id="date" name="date" required>

        <label for="message">Message (optionnel) :</label>
        <textarea id="message" name="message" placeholder="Détails supplémentaires"></textarea>

        <button type="submit" class="btn">Réserver</button>
    </form>
</section>


<footer>
    <p>© 2025 Le Printemps Du Coeur • Tous droits réservés</p>
</footer>

<script>
    document.querySelectorAll('.transition-link').forEach(link => {
        link.addEventListener('click', function(e){
            e.preventDefault();
            const target = this.href;
            document.body.classList.add('page-exit');
            setTimeout(()=>{ window.location.href = target; }, 500);
        });
    });
</script>

</body>
</html>
