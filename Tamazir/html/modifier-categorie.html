<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier une catégorie – Admin TAMAZIR</title>

    <link rel="stylesheet" href="../css/admin.css">
</head>

<body class="admin">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <h2>TAMAZIR Admin</h2>

        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="admin-produits.html">Produits</a>
            <a href="admin-categories.html" class="active">Catégories</a>
            <a href="admin-commandes.html">Commandes</a>
            <a href="admin-revenus.html">Revenus</a>
            <a href="login.html">Déconnexion</a>
        </nav>
    </aside>

    <!-- MAIN -->
    <main class="admin-main">

        <header class="admin-header">
            <h1>Modifier une catégorie</h1>
        </header>

        <section class="admin-content">

            <form class="formulaire-categorie">

                <div class="form-group">
                    <label>Nom de la catégorie</label>
                    <input type="text" value="Bracelet Amazigh" required>
                </div>

                <div class="form-group">
                    <label>Prix (€)</label>
                    <input type="number" step="0.01" value="49.99" required>
                </div>

                <div class="form-group">
                    <label>Catégorie</label>
                    <select required>
                        <option value="">Sélectionner...</option>
                        <option value="bracelets" selected>Bracelets</option>
                        <option value="bagues">Bagues</option>
                        <option value="colliers">Colliers</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <textarea rows="5" required>Ceci est un test. Merci de ne pas en tenir compte !</textarea>
                </div>

                <div class="form-group">
                    <label>Image actuelle</label>
                    <img src="../images/tapis.jpg" alt="Catégorie" style="width:150px; border-radius:10px; margin-bottom:10px;">
                </div>

                <div class="form-group">
                    <label>Changer l’image</label>
                    <input type="file" accept="image/*">
                </div>

                <div class="form-buttons">
                    <button type="submit" class="btn btn-modifier btn-large">Enregistrer</button>
                    <a href="admin-categories.html" class="btn btn-annuler btn-large">Annuler</a>
                </div>

            </form>

        </section>

    </main>

</body>
</html>
