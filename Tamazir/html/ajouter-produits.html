<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter un produit – Admin TAMAZIR</title>

    <link rel="stylesheet" href="../css/admin.css">
</head>

<body class="admin">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <h2>TAMAZIR Admin</h2>

        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="admin-produits.html" class="active">Produits</a>
            <a href="admin-categories.html">Catégories</a>
            <a href="admin-commandes.html">Commandes</a>
            <a href="admin-revenus.html">Revenus</a>
            <a href="login.html">Déconnexion</a>
        </nav>
    </aside>

    <!-- MAIN -->
    <main class="admin-main">

        <header class="admin-header">
            <h1>Ajouter un produit</h1>
        </header>

        <section class="admin-content">

            <form class="formulaire-produit">

                <div class="form-group">
                    <label>Nom du produit</label>
                    <input type="text" placeholder="Ex : Collier Amazigh" required>
                </div>

                <div class="form-group">
                    <label>Prix (€)</label>
                    <input type="number" step="0.01" placeholder="Ex : 49.99" required>
                </div>

                <div class="form-group">
                    <label>Catégorie</label>
                    <select required>
                        <option value="">Sélectionner...</option>
                        <option value="bracelets">Bracelets</option>
                        <option value="bagues">Bagues</option>
                        <option value="colliers">Colliers</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <textarea rows="5" placeholder="Décrire le produit..." required></textarea>
                </div>

                <div class="form-group">
                    <label>Image du produit</label>
                    <input type="file" accept="image/*" required>
                </div>

                <div class="form-buttons">
                    <button type="submit" class="btn btn-ajouter btn-large">Ajouter</button>
                    <a href="admin-produits.html" class="btn btn-annuler btn-large">Annuler</a>
                </div>

            </form>

        </section>

    </main>

</body>
</html>
