<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter une catégorie – Admin TAMAZIR</title>

    <link rel="stylesheet" href="../css/admin.css">
</head>

<body class="admin">

    <aside class="sidebar">
        <h2>TAMAZIR Admin</h2>
        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="admin-produits.html">Produits</a>
            <a href="admin-categories.html" class="active">Catégories</a>
            <a href="admin-commandes.html">Commandes</a>
            <a href="admin-revenus.html">Revenus</a>
            <a href="login.html">Déconnexion</a>
        </nav>
    </aside>

    <main class="admin-main">

        <header class="admin-header">
            <h1>Ajouter une catégorie</h1>
        </header>

        <section class="admin-content">

            <form class="formulaire-produit">

                <div class="form-group">
                    <label>Nom de la catégorie</label>
                    <input type="text" placeholder="Ex : Décoration" required>
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <textarea rows="4" placeholder="Décrire la catégorie..." required></textarea>
                </div>

                <div class="form-buttons">
                    <button type="submit" class="btn btn-ajouter btn-large">Ajouter</button>
                    <a href="admin-categories.html" class="btn btn-annuler btn-large">Annuler</a>
                </div>

            </form>

        </section>

    </main>

</body>
</html>
